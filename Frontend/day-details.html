<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Day Details</title>
  <link rel="stylesheet" href="./css/day-details.css" />
  <link rel="stylesheet" href="./components/sidebar/sidebar.css" />
</head>
<body>
  <div class="app-shell">
    <aside id="sidebar-root" class="sidebar-shell" aria-label="Sidebar navigation"></aside>

    <main class="content-shell">
      <section class="day-details-page">
        <div class="page-header">
          <div>
            <p class="eyebrow">Day insights</p>
            <h1 id="day-title">Daily meal details</h1>
            <p id="day-copy" class="subcopy">Loading the selected day...</p>
          </div>
          <a href="/fitness-dashboard" class="secondary-btn">Back to dashboard</a>
        </div>

        <div id="day-summary-grid" class="day-summary-grid"></div>

        <section class="meal-tabs-panel">
          <div class="tab-header-row">
            <div>
              <p class="eyebrow">Meal breakdown</p>
              <h2>Explore each meal</h2>
            </div>
            <p class="subcopy">Switch tabs to review a specific meal and the items consumed during it.</p>
          </div>

          <div id="meal-tabs" class="meal-tabs" role="tablist" aria-label="Meal tabs"></div>
          <div id="meal-panel" class="meal-panel"></div>
        </section>
      </section>
    </main>
  </div>

  <div id="add-item-modal" class="modal hidden" aria-hidden="true">
    <div class="modal-backdrop" data-close-modal></div>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="add-item-title">
      <div class="modal-header">
        <div>
          <p class="eyebrow">Add item</p>
          <h2 id="add-item-title">Add food to this meal</h2>
        </div>
        <button id="close-add-item-modal" class="icon-btn" type="button" aria-label="Close add item modal">×</button>
      </div>

      <form id="add-item-form" class="add-item-form">
        <label>
          <span>Food item</span>
          <select id="add-item-food-select" required></select>
        </label>

        <div class="modal-form-grid">
          <label>
            <span>Quantity</span>
            <input id="add-item-quantity" type="number" min="0.1" step="0.1" value="1" required />
          </label>

          <label>
            <span>Unit</span>
            <select id="add-item-unit">
              <option value="g">g</option>
              <option value="kg">kg</option>
              <option value="oz">oz</option>
              <option value="ml">ml</option>
              <option value="unit">unit</option>
            </select>
          </label>
        </div>

        <label>
          <span>Notes</span>
          <textarea id="add-item-notes" rows="4" placeholder="Optional notes"></textarea>
        </label>

        <div id="catalog-item-summary" class="catalog-item-summary hidden">
          <p class="catalog-item-summary-title">Selected food</p>
          <p id="catalog-item-preview" class="catalog-item-preview"></p>
        </div>

        <p id="add-item-feedback" class="add-item-feedback" aria-live="polite"></p>

        <div class="modal-actions">
          <button type="button" class="secondary-btn" data-close-modal>Cancel</button>
          <button id="add-item-submit-btn" type="submit" class="primary-btn">Add item</button>
        </div>
      </form>
    </div>
  </div>

  <div id="edit-item-modal" class="modal hidden" aria-hidden="true">
    <div class="modal-backdrop" data-close-modal></div>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="edit-item-title">
      <div class="modal-header">
        <div>
          <p class="eyebrow">Edit item</p>
          <h2 id="edit-item-title">Modify quantity</h2>
        </div>
        <button id="close-edit-item-modal" class="icon-btn" type="button" aria-label="Close edit item modal">×</button>
      </div>

      <form id="edit-item-form" class="edit-item-form">
        <div class="modal-form-grid">
          <label>
            <span>Quantity</span>
            <input id="edit-item-quantity" type="number" min="0.1" step="0.1" required />
          </label>

          <label>
            <span>Unit</span>
            <select id="edit-item-unit">
              <option value="g">g</option>
              <option value="kg">kg</option>
              <option value="oz">oz</option>
              <option value="ml">ml</option>
              <option value="unit">unit</option>
            </select>
          </label>
        </div>

        <p id="edit-item-feedback" class="edit-item-feedback" aria-live="polite"></p>

        <div class="modal-actions">
          <button type="button" class="secondary-btn" data-close-modal>Cancel</button>
          <button id="edit-item-submit-btn" type="submit" class="primary-btn">Update item</button>
        </div>
      </form>
    </div>
  </div>

  <script src="./js/config.js"></script>
  <script src="./js/auth.js"></script>
  <script type="module" src="./components/sidebar/sidebar.js"></script>
  <script src="./js/day-details.js"></script>
</body>
</html>
