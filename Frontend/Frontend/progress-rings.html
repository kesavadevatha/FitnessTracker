<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Progress Rings | Fitness Tracker</title>
  <link rel="stylesheet" href="./css/fitness-dashboard.css" />
  <link rel="stylesheet" href="./css/progress.css" />
  <link rel="stylesheet" href="./components/sidebar/sidebar.css" />
</head>
<body>
  <div class="app-shell">
    <aside id="sidebar-root" class="sidebar-shell" aria-label="Sidebar navigation"></aside>

    <main class="content-shell">
      <section class="dashboard-view">
        <div class="progress-page-main">
          <section class="dashboard-header">
            <div>
              <p class="eyebrow">Daily progress</p>
              <h1>Progress Rings</h1>
              <p class="subcopy">Compare today's intake against your target goals with visual progress rings.</p>
            </div>
            <div>
              <label style="display:flex;flex-direction:column;gap:6px;">
                <span class="eyebrow" style="text-transform:none;color:var(--muted);font-size:0.9rem;">Date</span>
                <input id="progress-date" type="date" value="" style="border-radius:12px;padding:8px 12px;border:1px solid var(--border);background:rgba(8,17,31,0.9);color:var(--text)" />
              </label>
            </div>
          </section>

          <section class="rings-section">
            <div id="rings-container" class="rings-container" aria-live="polite">
              <!-- rings will render here -->
            </div>
            <div id="rings-feedback" class="progress-feedback">Loading target and intake data...</div>
          </section>
        </div>
      </section>
    </main>
  </div>

  <script src="./js/config.js"></script>
  <script src="./js/auth.js"></script>
  <script type="module" src="./components/sidebar/sidebar.js"></script>
  <script src="./js/progress-rings.js"></script>
</body>
</html>
