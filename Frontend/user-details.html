<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile | Fitness Tracker</title>
  <link rel="stylesheet" href="./css/auth.css" />
</head>
<body>
  <div class="auth-shell">
    <div class="auth-card">
      <h1>My profile</h1>
      <p class="auth-subcopy">Keep your personal details and goal settings up to date. You can edit these values anytime.</p>

      <p class="auth-help">Signed in as <strong id="profile-email"></strong></p>

      <form id="user-profile-form">
        <label>
          <span>Gender</span>
          <select name="gender">
            <option value="">Select gender</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>
            <option value="Prefer not to say">Prefer not to say</option>
          </select>
        </label>

        <label>
          <span>Weight (kg)</span>
          <input type="number" step="0.1" min="1" name="weight" placeholder="e.g. 75" />
        </label>

        <label>
          <span>Height (cm)</span>
          <input type="number" step="0.1" min="1" name="height" placeholder="e.g. 175" />
        </label>

        <label>
          <span>Date of birth</span>
          <input type="date" name="dateOfBirth" />
        </label>

        <label>
          <span>Goal</span>
          <select name="goal">
            <option value="">Select your goal</option>
            <option value="Fat loss">Fat loss</option>
            <option value="Muscle gain">Muscle gain</option>
            <option value="Maintenance">Maintenance</option>
          </select>
        </label>

        <p id="profile-feedback" class="auth-feedback" aria-live="polite"></p>

        <button type="submit">Save details</button>
      </form>
    </div>
  </div>

  <script src="./js/auth.js"></script>
  <script src="./js/user-details.js"></script>
</body>
</html>
