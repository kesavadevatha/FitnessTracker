<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile | Fitness Tracker</title>
  <link rel="stylesheet" href="./css/auth.css" />
  <link rel="stylesheet" href="./css/fitness-dashboard.css" />
</head>
<body>
  <div class="auth-shell">
    <div class="auth-card">
      <div class="profile-header">
        <div>
          <h1>🏃 My Profile</h1>
          <p class="auth-subcopy">Keep your personal details and goal settings up to date. You can edit these values anytime.</p>
        </div>
      </div>

      <p class="auth-help">Signed in as <strong id="profile-email"></strong></p>

      <form id="user-profile-form">
        <div class="profile-form-section">
          <div class="section-header">
            <p class="eyebrow">👤 Basic information</p>
          </div>
          <div class="form-grid-row">
            <label>
              <span>Gender</span>
              <select name="gender">
                <option value="">Select gender</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Prefer not to mention">Prefer not to mention</option>
              </select>
            </label>
          </div>
        </div>

        <div class="profile-form-section">
          <div class="section-header">
            <p class="eyebrow">📏 Physical measurements</p>
          </div>
          <div class="form-grid-row">
            <label>
              <span>Weight</span>
              <div class="split-input">
                <input type="number" step="0.1" min="1" name="weightValue" placeholder="e.g. 75" />
                <select name="weightUnit">
                  <option value="">Unit</option>
                  <option value="kg">kg</option>
                  <option value="lb">lb</option>
                </select>
              </div>
            </label>

            <label>
              <span>Height</span>
              <div class="split-input">
                <input type="number" step="0.1" min="1" name="heightValue" placeholder="e.g. 175" />
                <select name="heightUnit">
                  <option value="">Unit</option>
                  <option value="cm">cm</option>
                  <option value="in">in</option>
                </select>
              </div>
            </label>
          </div>
        </div>

        <div class="profile-form-section">
          <div class="section-header">
            <p class="eyebrow">🎯 Goals & lifestyle</p>
          </div>
          <div class="form-grid-row">
            <label>
              <span>Date of birth</span>
              <input type="date" name="dateOfBirth" />
            </label>

            <label>
              <span>Fitness goal</span>
              <select name="goal">
                <option value="">Select your goal</option>
                <option value="Body recomposition">Body recomposition</option>
                <option value="Lose Fat">Lose Fat</option>
                <option value="Build Muscle">Build Muscle</option>
                <option value="Lose Fat & Build Muscle">Lose Fat & Build Muscle</option>
                <option value="Maintain Weight">Maintain Weight</option>
                <option value="Gain Weight">Gain Weight</option>
                <option value="Healthy Lifestyle">Healthy Lifestyle</option>
              </select>
            </label>
          </div>
        </div>

        <div class="profile-form-section">
          <div class="section-header">
            <p class="eyebrow">⚡ Activity level</p>
          </div>
          <div class="form-grid-row">
            <label>
              <span>Daily activity level</span>
              <select name="activityLevel">
                <option value="">Select activity level</option>
                <option value="sedentary">Sedentary (little or no exercise)</option>
                <option value="light">Lightly Active (exercise 1–3 days/week)</option>
                <option value="moderate">Moderately Active (exercise 3–5 days/week)</option>
                <option value="active">Very Active (exercise 6–7 days/week)</option>
                <option value="athlete">Athlete / Extremely Active (intense training twice daily or physical job)</option>
              </select>
            </label>
          </div>
        </div>

        <p id="profile-feedback" class="auth-feedback" aria-live="polite"></p>

        <div class="button-row">
          <button type="button" id="profile-back-button" class="secondary-button">Back to dashboard</button>
          <button type="submit">Save details</button>
        </div>
      </form>
    </div>
  </div>

  <script src="./js/config.js"></script>
  <script src="./js/auth.js"></script>
  <script src="./js/user-details.js"></script>
</body>
</html>
