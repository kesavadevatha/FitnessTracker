<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Progress Monitor</title>
  <link rel="stylesheet" href="./css/fitness-dashboard.css" />
  <link rel="stylesheet" href="./css/food-catalog-browser.css" />
  <link rel="stylesheet" href="./components/sidebar/sidebar.css" />
  <style>
    .admin-progress-page {
      padding: 32px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .page-header {
      margin-bottom: 32px;
    }

    .page-header h1 {
      font-size: 28px;
      font-weight: 600;
      margin: 16px 0 8px 0;
    }

    .page-header .eyebrow {
      font-size: 12px;
      text-transform: uppercase;
      color: #64748b;
      margin: 0;
    }

    .page-header .subcopy {
      font-size: 14px;
      color: #94a3b8;
      margin: 8px 0 0 0;
    }

    .user-selection-section {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 24px;
      margin-bottom: 32px;
    }

    .user-search-group {
      display: flex;
      gap: 12px;
      align-items: flex-end;
    }

    .user-search-field {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .user-search-field label {
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 8px;
      color: #cbd5e1;
    }

    .user-search-field input {
      padding: 10px 12px;
      border: 1px solid #475569;
      border-radius: 6px;
      background: #0f172a;
      color: #e2e8f0;
      font-size: 14px;
    }

    .user-search-field input::placeholder {
      color: #64748b;
    }

    .user-search-field input:focus {
      outline: none;
      border-color: #4f46e5;
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
    }

    .search-btn {
      padding: 10px 16px;
      background: #4f46e5;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: background 0.2s;
    }

    .search-btn:hover {
      background: #4338ca;
    }

    .fetch-btn {
      padding: 12px 24px;
      background: #10b981;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: background 0.2s;
      margin-top: 16px;
    }

    .fetch-btn:hover:not(:disabled) {
      background: #059669;
    }

    .fetch-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .progress-results {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-top: 24px;
    }

    .progress-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 20px;
      display: flex;
      flex-direction: column;
    }

    .progress-card .metric-icon {
      font-size: 24px;
      margin-bottom: 8px;
    }

    .progress-card .metric-label {
      font-size: 12px;
      text-transform: uppercase;
      color: #94a3b8;
      margin-bottom: 8px;
      font-weight: 500;
    }

    .progress-card .metric-value {
      font-size: 24px;
      font-weight: 600;
      color: #e2e8f0;
    }

    .progress-card .metric-subtext {
      font-size: 12px;
      color: #64748b;
      margin-top: 4px;
    }

    .status-message {
      padding: 12px 16px;
      border-radius: 6px;
      margin-bottom: 16px;
      font-size: 14px;
      display: none;
    }

    .status-message.success {
      display: block;
      background: #d1fae5;
      color: #065f46;
      border: 1px solid #6ee7b7;
    }

    .status-message.error {
      display: block;
      background: #fee2e2;
      color: #7f1d1d;
      border: 1px solid #fca5a5;
    }

    .status-message.loading {
      display: block;
      background: #dbeafe;
      color: #1e40af;
      border: 1px solid #93c5fd;
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #94a3b8;
    }

    .empty-state p {
      margin: 8px 0;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside id="sidebar-root" class="sidebar-shell" aria-label="Sidebar navigation"></aside>

    <main class="content-shell">
      <section class="admin-progress-page">
        <div class="page-header">
          <p class="eyebrow">Admin Tools</p>
          <h1>User Progress Monitor</h1>
          <p class="subcopy">Search for a user and view their progress metrics including calories, macros, deficit tracking, and overall rating.</p>
        </div>

        <div class="user-selection-section">
          <div class="user-search-group">
            <div class="user-search-field" style="flex: 1;">
              <label for="user-email-input">Select User</label>
              <input type="text" id="user-email-input" placeholder="Search user by email..." readonly />
            </div>
            <button id="open-user-modal" class="search-btn">🔍 Search Users</button>
          </div>
          <button id="fetch-progress-btn" class="fetch-btn" disabled>Fetch Progress</button>
        </div>

        <div id="status-message" class="status-message"></div>

        <div id="progress-results" class="progress-results"></div>
      </section>
    </main>
  </div>

  <script src="./js/config.js"></script>
  <script src="./js/auth.js"></script>
  <script type="module" src="./components/sidebar/sidebar.js"></script>
  <script src="./js/admin-progress.js"></script>
</body>
</html>
