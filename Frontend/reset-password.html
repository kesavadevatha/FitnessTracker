<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password | Fitness Tracker</title>

  <!-- CSS -->
  <link rel="stylesheet" href="./css/auth.css" />
</head>

<body>
  <div class="auth-shell">
    <div class="auth-card">
      <h1>Reset your password</h1>

      <p class="auth-subcopy">
        Create a new password to continue using the app.
        This step is required after an administrator reset.
      </p>

      <p class="auth-help">
        Signed in as
        <strong id="reset-user-email"></strong>
      </p>

      <form id="reset-password-form">
        <label>
          <span>New password</span>
          <input
            type="password"
            name="password"
            required
            autocomplete="new-password"
            placeholder="New password"
          />
        </label>

        <label>
          <span>Confirm password</span>
          <input
            type="password"
            name="confirmPassword"
            required
            autocomplete="new-password"
            placeholder="Confirm password"
          />
        </label>

        <p
          id="reset-feedback"
          class="auth-feedback"
          aria-live="polite"
        ></p>

        <button type="submit">
          Update password
        </button>
      </form>
    </div>
  </div>

  <!-- Success Modal -->
  <div
    id="reset-success-modal"
    class="reset-success-modal hidden"
    role="alertdialog"
    aria-live="assertive"
  >
    <div class="reset-success-inner">
      <h2>Password updated</h2>
      <p>
        Your password has been reset successfully
        and you are now logged in.
      </p>
    </div>
  </div>

  <!-- JS -->
  <script src="./js/auth.js"></script>
  <script src="./js/reset-password.js"></script>
</body>
</html>
