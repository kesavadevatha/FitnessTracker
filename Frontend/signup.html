<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up | Fitness Tracker</title>
  <link rel="stylesheet" href="./css/auth.css" />
</head>
<body>
  <div class="auth-shell">
    <div class="auth-card">
      <h1>Create account</h1>
      <p class="auth-subcopy">Enter your email and password to create a new account.</p>

      <form id="register-form">
        <label>
          <span>Username or Email</span>
          <input type="text" name="email" required autocomplete="username" placeholder="you@example.com" />
        </label>

        <label>
          <span>Password</span>
          <input type="password" name="password" required autocomplete="new-password" placeholder="Enter your password" />
        </label>

        <label>
          <span>Confirm password</span>
          <input type="password" name="confirmPassword" required autocomplete="new-password" placeholder="Confirm your password" />
        </label>

        <p id="register-feedback" class="auth-feedback" aria-live="polite"></p>

        <button type="submit">Create account</button>
      </form>

      <p class="auth-footer">Already have an account? <a href="/login">Sign in</a>.</p>
    </div>
  </div>

  <script src="./js/config.js"></script>
  <script src="./js/auth.js"></script>
  <script src="./js/signin.js"></script>
</body>
</html>
