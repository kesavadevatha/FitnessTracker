<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Fitness Tracker</title>
  <link rel="stylesheet" href="/css/auth.css" />
</head>
<body>
  <div class="auth-shell">
    <div class="auth-card">
      <h1>Welcome back</h1>
      <p class="auth-subcopy">Sign in with your email and password. If you forgot your password, contact your administrator to reset it.</p>

      <form id="login-form">
        <label>
          <span>Username or Email</span>
          <input type="text" name="email" required autocomplete="username" placeholder="admin or you@example.com" />
        </label>

        <label>
          <span>Password</span>
          <input type="password" name="password" required autocomplete="current-password" placeholder="Enter your password" />
        </label>

        <p id="login-feedback" class="auth-feedback" aria-live="polite"></p>

        <button type="submit">Sign in</button>
      </form>

      <p class="auth-footer">Need help? Ask your administrator to reset your password.</p>
    </div>
  </div>

  <script src="/js/auth.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
