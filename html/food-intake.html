<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Food Intake</title>
  <link rel="stylesheet" href="/css/food-intake.css" />
  <link rel="stylesheet" href="/components/sidebar/sidebar.css" />
</head>
<body>
  <div class="app-shell">
    <aside id="sidebar-root" class="sidebar-shell" aria-label="Sidebar navigation"></aside>

    <main class="content-shell">
      <section class="food-intake-page">
        <div class="page-header">
          <div>
            <p class="eyebrow">Food intelligence</p>
            <h1>Food Intake Details</h1>
            <p class="subcopy">Enter a food description and quantity, then fetch macros from your local food catalog.</p>
          </div>
        </div>

        <div class="entry-grid">
          <form id="food-form" class="food-form">
            <label>
              <span>Food description</span>
              <input type="text" id="food-text" name="foodText" placeholder="e.g. 150g of boiled white rice" required />
            </label>

            <div class="form-row">
              <label>
                <span>Quantity</span>
                <input type="number" id="quantity" name="quantity" min="1" step="0.1" value="150" required />
              </label>

              <label>
                <span>Unit</span>
                <select id="unit" name="unit">
                  <option value="g">grams</option>
                  <option value="kg">kilograms</option>
                  <option value="oz">ounces</option>
                  <option value="ml">milliliters</option>
                  <option value="unit">quantity</option>
                </select>
              </label>
            </div>

            <label>
              <span>Optional notes</span>
              <textarea id="notes" name="notes" rows="4" placeholder="Add meal notes or context(optional)"></textarea>
            </label>

            <div class="form-actions">
              <button type="reset" class="secondary-btn">Reset</button>
              <button type="submit" class="primary-btn">Fetch macros</button>
            </div>
            <p id="form-status" class="form-status" aria-live="polite"></p>
          </form>

          <div id="macro-result" class="macro-result hidden" aria-live="polite">
            <div class="result-header">
              <div>
                <p class="eyebrow">Live result</p>
                <h2 id="result-food-name">Food macros</h2>
              </div>
              <p id="result-source" class="result-source"></p>
            </div>

            <div class="macro-grid">
              <article class="macro-card">
                <span>Calories</span>
                <strong id="macro-calories">0</strong>
              </article>
              <article class="macro-card">
                <span>Protein</span>
                <strong id="macro-protein">0g</strong>
              </article>
              <article class="macro-card">
                <span>Carbs</span>
                <strong id="macro-carbs">0g</strong>
              </article>
              <article class="macro-card">
                <span>Fat</span>
                <strong id="macro-fat">0g</strong>
              </article>
            </div>

            <p id="result-note" class="result-note"></p>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="/js/auth.js"></script>
  <script type="module" src="/components/sidebar/sidebar.js"></script>
  <script src="/js/food-intake.js"></script>
</body>
</html>
